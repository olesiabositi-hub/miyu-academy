name: Bootstrap MIYU Academy source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source package
        run: |
          set -eux
          tmp="$(mktemp -d)"
          tar -xzf miyu-bootstrap.tar.gz -C "$tmp"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name miyu-bootstrap.tar.gz -exec rm -rf {} +
          cp -a "$tmp"/. .
          rm -f miyu-bootstrap.tar.gz
          rm -f .github/workflows/bootstrap.yml
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add MIYU Academy final source build"
          git push
